services:
  postgres:
    image: postgres:16
    container_name: cloud_storage_db
    ports:
      - ${POSTGRES_PORTS}
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
  minio:
    image: minio/minio:latest
    container_name: cloud_storage_minio
    command: server /data --console-address ":9001"
    ports:
      - ${MINIO_API_PORTS_1}
      - ${MINIO_API_PORTS_2}
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
  redis:
    image: redis:latest
    container_name: cloud_storage_redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - ${REDIS_PORTS}
    volumes:
      - redis_data:/data
  app:
    profiles: ["app"]
    image: eclipse-temurin:17-jre
    container_name: cloud_storage_app
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
      - minio
    ports:
      - ${APP_PORTS:-8080:8080}
    environment:
      SERVER_ADDRESS: 0.0.0.0
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      SPRING_SESSION_REDIS_NAMESPACE: cloud-file-app-sessions
      SPRING_SESSION_STORE_TYPE: redis
      SERVER_SERVLET_SESSION_TIMEOUT: 900
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - ${APP_JAR:-./cloud-storage-0.0.1-SNAPSHOT.jar}:/app/app.jar:ro
    command: ["java", "-jar", "/app/app.jar"]
volumes:
  postgres_data:
  minio_data:
  redis_data:
